
name: Build Amir Book Stall APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Amir_Book_Stall_Android_App_Project_Mobile_Build.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -o Amir_Book_Stall_Android_App_Project_Mobile_Build.zip -d project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project/AmirBookStallQuotationApp
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amir-Book-Stall-APK
          path: project/AmirBookStallQuotationApp/app/build/outputs/apk/debug/*.apk
          
